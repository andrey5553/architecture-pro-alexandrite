global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'service1'
    static_configs:
      - targets: ['host.docker.internal:5001']  # для Windows/Mac
    metrics_path: /metrics
    scheme: http

  - job_name: 'service1-local'
    static_configs:
      - targets: ['localhost:5001']  # для Linux
    metrics_path: /metrics
    scheme: http
    